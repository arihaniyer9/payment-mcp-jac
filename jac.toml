[project]
name = "empty"
version = "0.0.1"
description = "Empty Jac project - start from scratch"
entry-point = "main.jac"
kind = "web-app"

[byllm]
[byllm.model]
default_model = "${LLM_MODEL:-groq/openai/gpt-oss-120b}"
api_key = "${GROQ_API_KEY:-}"

[byllm.call_params]
temperature = 0.0


[jac-shadcn]
style = "nova"
baseColor = "neutral"
theme = "amber"
font = "inter"
radius = "default"
menuAccent = "subtle"
menuColor = "default"

[dependencies]
stripe = "~=15.6"

[dependencies.npm]
react = "^18.2.0"
react-dom = "^18.2.0"
react-router-dom = "^6.22.0"
react-error-boundary = "^5.0.0"
react-hook-form = "^7.71.0"
"@hookform/resolvers" = "^5.2.2"
"@tanstack/react-form" = "^1.33.0"
zod = "^4.3.6"
"@hugeicons/react" = "1.1.10"
"@hugeicons/core-free-icons" = "4.3.3"
"@radix-ui/react-slot" = "1.3.3"
radix-ui = "1.6.7"
class-variance-authority = "0.7.1"
"@fontsource-variable/inter" = "5.3.0"
shadcn = "^3.8.5"
clsx = "^2.1.1"
tailwind-merge = "^3.5.0"
tw-animate-css = "^1.4.0"
"@base-ui/react" = "1.8.0"
cmdk = "1.1.1"
embla-carousel-react = "8.6.0"
input-otp = "1.5.0"
react-day-picker = "10.0.1"
react-resizable-panels = "4.12.4"
recharts = "3.10.1"
sonner = "2.0.8"
vaul = "1.1.2"

[dependencies.npm.dev]
vite = "^6.4.1"
"@vitejs/plugin-react" = "^4.2.1"
typescript = "^5.3.3"
"@types/react" = "^18.2.0"
"@types/react-dom" = "^18.2.0"
tailwindcss = "4.3.3"
"@tailwindcss/vite" = "4.3.3"



[dev-dependencies]
watchdog = ">=3.0.0"

[serve]
base_route_app = "app"

[client]
[client.vite]
plugins = ["tailwindcss()"]
lib_imports = ["import tailwindcss from '@tailwindcss/vite'"]

[client.app_meta_data]
title = "A blank canvas"
description = "A minimal jac-shadcn starter with the theme wired up and nothing in the way."
keywords = "jac, starter, shadcn, template"
author = "Blank canvas"
theme_color = "#dc7702"
og_type = "website"
og_title = "A blank canvas"
og_description = "A minimal jac-shadcn starter."
og_site_name = "Blank canvas"


[scale]
[scale.microservices]
enabled = false

[jacpack]
name = 'payment-mcp-jac'
description = 'Jac IDE snapshot for payment-mcp-jac'

[jachammer]
project_id = "prj_31f3304b79954a4cb6450ea7c681bba9"
